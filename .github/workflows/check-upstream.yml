name: Check Upstream Release

on:
  schedule:
    # Run every Friday at 6 PM UTC (Saturday 2 AM Malaysia)
    - cron: '0 18 * * 5'
  workflow_dispatch:

jobs:
  check-and-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cli/cli.git
          git fetch upstream --tags

      - name: Check for new upstream release
        id: check
        run: |
          # Get latest upstream tag
          LATEST_UPSTREAM=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "Latest upstream tag: $LATEST_UPSTREAM"
          
          # Get current base from our latest ca-bundle tag
          LATEST_BUNDLE=$(git tag -l '*-ca-bundle.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_BUNDLE" ]; then
            echo "No existing ca-bundle tag found"
            CURRENT_BASE=""
          else
            CURRENT_BASE=$(echo "$LATEST_BUNDLE" | sed 's/-ca-bundle\.[0-9]*$//')
            echo "Current ca-bundle base: $CURRENT_BASE"
          fi
          
          if [ "$LATEST_UPSTREAM" == "$CURRENT_BASE" ]; then
            echo "No new upstream release. Current: $CURRENT_BASE, Latest: $LATEST_UPSTREAM"
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream release found: $LATEST_UPSTREAM"
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_UPSTREAM" >> $GITHUB_OUTPUT
          fi

      - name: Rebase ca-bundle branch
        if: steps.check.outputs.new_release == 'true'
        id: rebase
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git checkout ca-bundle
          
          if git rebase $VERSION; then
            echo "Rebase successful"
            echo "rebase_success=true" >> $GITHUB_OUTPUT
          else
            echo "Rebase failed"
            echo "rebase_success=false" >> $GITHUB_OUTPUT
            git rebase --abort
            exit 1
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.rebase_success == 'true'
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git push origin ca-bundle --force-with-lease

      - name: Create new tag
        if: steps.rebase.outputs.rebase_success == 'true'
        run: |
          VERSION=${{ steps.check.outputs.version }}
          NEW_TAG="${VERSION}-ca-bundle.1"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "Created and pushed tag: $NEW_TAG"

      - name: Create issue on rebase failure
        if: failure() && steps.rebase.outputs.rebase_success == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const version = '${{ steps.check.outputs.version }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto] Rebase failed for ${version}`,
              body: `Automatic rebase of ca-bundle branch onto upstream ${version} failed.\n\nPlease resolve conflicts manually and trigger the workflow again.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
